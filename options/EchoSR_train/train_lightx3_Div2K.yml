# general settings for image SR training
name: EchoSR_SR_x3_light_Div2K
model_type: EchoSRModel
scale: 3
num_gpu: 1
manual_seed: 1

# dataset and data loader settings
datasets:
  train:
    task: SR
    name: DIV2K
    type: PairedImageDataset
    dataroot_gt:
      - /mnt/data/WorkSpace/wbh/myMambaIR/datasets/DIV2K/HR
    dataroot_lq:
      - /mnt/data/WorkSpace/wbh/myMambaIR/datasets/DIV2K/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

    gt_size: 216
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 24
    batch_size_per_gpu: 32
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val_1:
    name: Urban100
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Urban100/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Urban100/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

  val_2:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Set5/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Set5/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

  val_3:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Set14/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Set14/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

  val_4:
    name: B100
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/B100/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/B100/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

  val_5:
    name: Manga109
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Manga109/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Manga109/LR_bicubic/X3
    filename_tmpl: '{}_LRBI_x3'
    io_backend:
      type: disk

# network structures
network_g:
  type: EchoSR
  upscale: 3
  in_chans: 3
  img_size: 72
  img_range: 1.
  d_state: 16
  depths: [5,5,5,5]
  kernel_sizes: [0, 5, 11, 17]
  embed_dim: 60
  mlp_ratio: 1.5
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'

# path
path:
  pretrain_network_g: /mnt/data/WorkSpace/wbh/myMambaIR/experiments/EchoSR_SR_x2_light_Div2K/models/EchoSR_SR_x2_light_Div2K.pth
  strict_load_g: false
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 1e-3
#    lr: !!float 6e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [200000, 300000, 400000, 480000,500000]
    gamma: 0.5

  total_iter: 520000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: mean
# validation settings
val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 3
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 3
      test_y_channel: true



# logging settings
logger:
  print_freq: 500
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
