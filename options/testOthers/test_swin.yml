# general settings for image SR training
name: SwinIRx4
model_type: SRModel
scale: 4
num_gpu: 1
manual_seed: 1

# dataset and data loader settings
datasets:

  test_1:
    name: Urban100
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Urban100/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Urban100/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

  test_2:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Set5/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Set5/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

  test_3:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Set14/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Set14/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

  test_4:
    name: B100
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/B100/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/B100/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

  test_5:
    name: Manga109
    type: PairedImageDataset
    dataroot_gt: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Manga109/HR
    dataroot_lq: /mnt/data/WorkSpace/wbh/myMambaIR/datasets/SR/Manga109/LR_bicubic/X2
    filename_tmpl: '{}_LRBI_x2'
    io_backend:
      type: disk

#  test_6:
# network structures
network_g:
  type: SwinIR
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 8
  img_range: 1.
  depths: [6,6,6,6]
  embed_dim: 60
  num_heads: [6,6,6,6]
  mlp_ratio: 2
  resi_connection: '1conv'
  upsampler: 'pixelshuffledirect'

# path
path:
  pretrain_network_g: F:\code\CodeProject\EchoSR\analysis\ckpt\002_lightweightSR_DIV2K_s64w8_SwinIR-S_x4.pth
  strict_load_g: true
#  param_key_g: ~
  resume_state: ~

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
